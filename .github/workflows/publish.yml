name: Publica IG 19h

on:
  schedule:
    # Cron do GitHub atrasa (às vezes horas), então disparamos 4× na janela da noite:
    # 19, 20, 21 e 22h BRT. A trava de idempotência garante que só 1 publica; o resto é no-op.
    # A guarda de janela (18–23h BRT) no script impede post de madrugada se o atraso for grande.
    - cron: '0 22 * * *'   # 19:00 BRT
    - cron: '0 23 * * *'   # 20:00 BRT
    - cron: '0 0 * * *'    # 21:00 BRT (00:00 UTC = 21:00 BRT do dia anterior)
    - cron: '0 1 * * *'    # 22:00 BRT
  workflow_dispatch:      # permite disparo manual pra testar
    inputs:
      post:
        description: 'Caminho de um post específico (opcional, ex: posts/semana35/post-ter-ipi.json)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publicar post do dia
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node ig/publish-ci.mjs ${{ github.event.inputs.post }}
