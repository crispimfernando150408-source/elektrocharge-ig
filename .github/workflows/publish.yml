name: Publica IG (de hora em hora)

on:
  schedule:
    # De hora em hora, das 8h às 22h BRT (UTC-3, sem horário de verão), no minuto 17.
    # O GitHub atrasa/descarta crons em hora cheia, por isso o minuto quebrado. Cada run publica
    # TODOS os posts aprovados do dia cujo schedule_at já chegou (GET /api/conteudo/hoje?lista=1)
    # e reporta cada um ao dashboard, que o tira da lista. Se um cron falhar, o da hora seguinte
    # pega o que ficou. Guarda de janela (8–23h BRT) impede post de madrugada.
    - cron: '17 11 * * *'   # 08:17 BRT
    - cron: '17 12 * * *'   # 09:17 BRT
    - cron: '17 13 * * *'   # 10:17 BRT
    - cron: '17 14 * * *'   # 11:17 BRT
    - cron: '17 15 * * *'   # 12:17 BRT
    - cron: '17 16 * * *'   # 13:17 BRT
    - cron: '17 17 * * *'   # 14:17 BRT
    - cron: '17 18 * * *'   # 15:17 BRT
    - cron: '17 19 * * *'   # 16:17 BRT
    - cron: '17 20 * * *'   # 17:17 BRT
    - cron: '17 21 * * *'   # 18:17 BRT
    - cron: '17 22 * * *'   # 19:17 BRT
    - cron: '17 23 * * *'   # 20:17 BRT
    - cron: '17 0 * * *'    # 21:17 BRT
    - cron: '17 1 * * *'    # 22:17 BRT
  workflow_dispatch:      # permite disparo manual pra testar
    inputs:
      post:
        description: 'Caminho de um post específico (opcional, ex: posts/semana35/post-ter-ipi.json)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        conta: [elektro, kaffra]
    # Um run por conta por vez: dois runs simultâneos podiam checar o feed antes de o outro
    # publicar. O em andamento nunca é cancelado; na fila fica só um pendente (um disparo
    # manual pendente pode ser substituído por um cron).
    concurrency:
      group: publish-ig-${{ matrix.conta }}
      cancel-in-progress: false
    # Um run travado seguraria os seguintes. O que não sair fica para o run seguinte.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publicar posts do dia (${{ matrix.conta }})
        env:
          IG_CONTA: ${{ matrix.conta }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_KAFFRA: ${{ secrets.IG_ACCESS_TOKEN_KAFFRA }}
          IG_USER_ID_KAFFRA: ${{ secrets.IG_USER_ID_KAFFRA }}
          CONTEUDO_API_BASE: ${{ vars.CONTEUDO_API_BASE }}
          CONTEUDO_SECRET: ${{ secrets.CONTEUDO_SECRET }}
          POST_MANUAL: ${{ github.event.inputs.post }}
        run: node ig/publish-ci.mjs $POST_MANUAL
