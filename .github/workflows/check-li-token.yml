# .github/workflows/check-li-token.yml
name: Avisa vencimento do token do LinkedIn

on:
  schedule:
    - cron: '0 12 * * 1'   # segunda, 9h BRT
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Checar vencimento
        env:
          LI_TOKEN_EXPIRES_AT: ${{ vars.LI_TOKEN_EXPIRES_AT }}
        run: node li/check-token.mjs
