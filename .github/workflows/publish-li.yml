# .github/workflows/publish-li.yml
name: Publica LinkedIn (perfil)

on:
  schedule:
    - cron: '23 11,14,17,20,23 * * *'   # 8h23, 11h23, 14h23, 17h23 e 20h23 BRT
  workflow_dispatch:
    inputs:
      dry:
        description: 'true = só resolve e loga, não publica'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        conta: [fernando, elektro, kaffra]
    concurrency:
      group: publish-li-${{ matrix.conta }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testes do publicador
        run: node --test li/lib.test.mjs
      - name: Publicar post do LinkedIn (${{ matrix.conta }})
        env:
          LI_CONTA: ${{ matrix.conta }}
          CONTEUDO_API_BASE: ${{ vars.CONTEUDO_API_BASE }}
          CONTEUDO_SECRET: ${{ secrets.CONTEUDO_SECRET }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_PERSON_URN: ${{ secrets.LI_PERSON_URN }}
          LI_ACCESS_TOKEN_ELEKTRO: ${{ secrets.LI_ACCESS_TOKEN_ELEKTRO }}
          LI_AUTHOR_URN_ELEKTRO: ${{ secrets.LI_AUTHOR_URN_ELEKTRO }}
          LI_ACCESS_TOKEN_KAFFRA: ${{ secrets.LI_ACCESS_TOKEN_KAFFRA }}
          LI_AUTHOR_URN_KAFFRA: ${{ secrets.LI_AUTHOR_URN_KAFFRA }}
        run: node li/publish-ci.mjs ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}
