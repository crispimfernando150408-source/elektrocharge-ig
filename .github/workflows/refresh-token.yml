name: Renova token IG (mensal)

on:
  schedule:
    - cron: '0 12 1 * *'   # dia 1 de cada mês, 12:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        conta: [elektro, kaffra]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Renovar token (${{ matrix.conta }})
        env:
          IG_CONTA: ${{ matrix.conta }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_KAFFRA: ${{ secrets.IG_ACCESS_TOKEN_KAFFRA }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node ig/refresh-token.mjs
