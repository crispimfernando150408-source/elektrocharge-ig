# .github/workflows/publish-x.yml
name: Publica X (perfil, espalhado no dia)

on:
  schedule:
    # Minutos quebrados (o GitHub descarta cron em hora cheia). 9h07 a 22h37 BRT = 12h a 1h UTC.
    - cron: '7 12,14,16,18,20,22,0 * * *'
    - cron: '37 13,15,17,19,21,23,1 * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: 'true = só resolve e loga, não publica'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        conta: [fernando, elektro, kaffra]
    concurrency:
      group: publish-x-${{ matrix.conta }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Testes do publicador
        run: node --test x/lib.test.mjs
      - name: Publicar post do X (${{ matrix.conta }})
        env:
          X_CONTA: ${{ matrix.conta }}
          CONTEUDO_API_BASE: ${{ vars.CONTEUDO_API_BASE }}
          CONTEUDO_SECRET: ${{ secrets.CONTEUDO_SECRET }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_USER_ID: ${{ secrets.X_USER_ID }}
          X_ACCESS_TOKEN_ELEKTRO: ${{ secrets.X_ACCESS_TOKEN_ELEKTRO }}
          X_ACCESS_TOKEN_SECRET_ELEKTRO: ${{ secrets.X_ACCESS_TOKEN_SECRET_ELEKTRO }}
          X_USER_ID_ELEKTRO: ${{ secrets.X_USER_ID_ELEKTRO }}
          X_ACCESS_TOKEN_KAFFRA: ${{ secrets.X_ACCESS_TOKEN_KAFFRA }}
          X_ACCESS_TOKEN_SECRET_KAFFRA: ${{ secrets.X_ACCESS_TOKEN_SECRET_KAFFRA }}
          X_USER_ID_KAFFRA: ${{ secrets.X_USER_ID_KAFFRA }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node x/publish-ci.mjs ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}
